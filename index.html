<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1020">
  <meta name="color-scheme" content="dark">
  <title>KAFKA</title>
  <meta name="description" content="KAFKA — 世界のあいだで、つくっている。">
  <meta name="author" content="KAFKA">
  <meta property="og:title" content="KAFKA">
  <meta property="og:description" content="世界のあいだで、つくっている。">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://kafka2306.github.io/kafka/">
  <link rel="canonical" href="https://kafka2306.github.io/kafka/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230B1020'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%235EDCF5' stroke-width='2'/%3E%3Ccircle cx='42' cy='22' r='4' fill='%23B9A6FF'/%3E%3C/svg%3E">
  <style>
    :root {
      --canvas: #0B1020;
      --surface: #12192B;
      --border: #2A3650;
      --text: #E8EEF8;
      --muted: #9AA7BD;
      --cyan: #5EDCF5;
      --lavender: #B9A6FF;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgb(185 166 255 / 0.15), transparent 27rem),
        radial-gradient(circle at 50% 78%, rgb(94 220 245 / 0.09), transparent 32rem),
        var(--canvas);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: 0.34;
      background-image:
        radial-gradient(circle at 18% 22%, rgb(232 238 248 / 0.7) 0 1px, transparent 1.4px),
        radial-gradient(circle at 77% 27%, rgb(94 220 245 / 0.7) 0 1px, transparent 1.4px),
        radial-gradient(circle at 68% 72%, rgb(185 166 255 / 0.72) 0 1px, transparent 1.4px),
        radial-gradient(circle at 29% 77%, rgb(232 238 248 / 0.46) 0 1px, transparent 1.4px);
      background-size: 19rem 19rem, 23rem 23rem, 29rem 29rem, 31rem 31rem;
    }

    body::after {
      background: linear-gradient(180deg, transparent, rgb(11 16 32 / 0.38));
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      padding: clamp(1.2rem, 4vw, 3rem);
      display: grid;
      place-items: center;
    }

    .profile {
      width: min(100%, 29rem);
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .avatar {
      position: relative;
      width: clamp(8.5rem, 24vw, 10.5rem);
      aspect-ratio: 1;
      margin-bottom: 2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 42% 38%, rgb(232 238 248 / 0.11), transparent 31%),
        radial-gradient(circle at 65% 72%, rgb(185 166 255 / 0.19), transparent 33%),
        radial-gradient(circle at 38% 68%, rgb(94 220 245 / 0.17), transparent 38%),
        rgb(18 25 43 / 0.72);
      border: 1px solid rgb(232 238 248 / 0.12);
      box-shadow:
        0 0 0 1rem rgb(232 238 248 / 0.018),
        0 0 5rem rgb(94 220 245 / 0.08),
        0 0 8rem rgb(185 166 255 / 0.08);
    }

    .avatar::before,
    .avatar::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .avatar::before {
      inset: 1.05rem;
      border: 1px solid rgb(94 220 245 / 0.38);
      box-shadow: inset 0 0 2rem rgb(94 220 245 / 0.08);
    }

    .avatar::after {
      width: 0.65rem;
      aspect-ratio: 1;
      top: 1.05rem;
      right: 1.15rem;
      background: var(--lavender);
      box-shadow: 0 0 1.5rem rgb(185 166 255 / 0.9);
    }

    .glyph {
      font-size: 2.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgb(232 238 248 / 0.88);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1.25rem;
      color: rgb(232 238 248 / 0.46);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 0.42rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 1rem rgb(94 220 245 / 0.78);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 12vw, 5.8rem);
      font-weight: 520;
      line-height: 0.95;
      letter-spacing: 0.08em;
    }

    .handle {
      margin: 0.85rem 0 0;
      color: rgb(232 238 248 / 0.38);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .statement {
      margin: 2.7rem 0 2.5rem;
      color: rgb(232 238 248 / 0.76);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      font-size: clamp(1.05rem, 3vw, 1.22rem);
      font-weight: 400;
      line-height: 1.9;
      letter-spacing: 0.09em;
    }

    nav {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }

    nav a {
      min-height: 3rem;
      display: grid;
      place-items: center;
      border: 1px solid rgb(232 238 248 / 0.09);
      border-radius: 999px;
      color: rgb(232 238 248 / 0.56);
      background: rgb(18 25 43 / 0.33);
      backdrop-filter: blur(12px);
      text-decoration: none;
      font-size: 0.62rem;
      font-weight: 650;
      letter-spacing: 0.2em;
      transition:
        color 160ms ease,
        border-color 160ms ease,
        background 160ms ease,
        transform 160ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--text);
      border-color: rgb(94 220 245 / 0.38);
      background: rgb(94 220 245 / 0.07);
      transform: translateY(-1px);
    }

    nav a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .signature {
      margin-top: 2rem;
      width: 3.2rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--lavender), transparent);
      opacity: 0.65;
    }

    ::selection {
      color: var(--canvas);
      background: var(--cyan);
    }

    @media (max-width: 480px) {
      main { padding: 1.25rem; }
      .profile { width: min(100%, 22rem); }
      .avatar { margin-bottom: 1.65rem; }
      .statement { margin-block: 2.15rem 2rem; }
      nav { gap: 0.45rem; }
      nav a { font-size: 0.57rem; letter-spacing: 0.15em; }
    }

    @media (prefers-reduced-motion: reduce) {
      nav a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="profile" aria-labelledby="name">
      <div class="avatar" aria-hidden="true"><span class="glyph">K</span></div>
      <div class="status">somewhere online</div>
      <h1 id="name">KAFKA</h1>
      <p class="handle">@kafka_vr</p>
      <p class="statement">世界のあいだで、つくっている。</p>

      <nav aria-label="Profile links">
        <a href="https://vrchat.com/home/user/usr_3e36606d-21c3-4be5-b4b5-4bb5f26eefb0" target="_blank" rel="me noopener noreferrer">VRCHAT</a>
        <a href="https://github.com/KAFKA2306" target="_blank" rel="me noopener noreferrer">CODE</a>
        <a href="https://x.com/kafka_vr" target="_blank" rel="me noopener noreferrer">SIGNAL</a>
      </nav>

      <div class="signature" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
