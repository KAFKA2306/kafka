<head>

  <meta name="author" content="KAFKA">
  <meta property="og:title" content="KAFKA">
  <meta property="og:description" content="データ、自動化、VR、金融分析をつくる個人開発者の入口。">
  <meta property="og:type" content="profile">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23F6F7FB'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%239CC8EB' stroke-width='2'/%3E%3Ccircle cx='42' cy='22' r='4' fill='%23C9B9E8'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #F6F7FB;
      --ink: #39445A;
      --muted: #8D97AA;
      --blue: #9CC8EB;
      --lilac: #C9B9E8;
      --pink: #EBC5CF;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 21% 16%, rgb(156 200 235 / 0.30), transparent 24rem),
        radial-gradient(circle at 78% 22%, rgb(201 185 232 / 0.28), transparent 24rem),
        radial-gradient(circle at 54% 86%, rgb(235 197 207 / 0.23), transparent 28rem),
        linear-gradient(155deg, #FCFCFE 0%, #F5F7FB 58%, #F8F5FA 100%);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.52;
      background-image:
        radial-gradient(circle at 17% 29%, rgb(57 68 90 / 0.16) 0 0.75px, transparent 1px),
        radial-gradient(circle at 77% 34%, rgb(156 200 235 / 0.52) 0 0.9px, transparent 1.2px),
        radial-gradient(circle at 67% 73%, rgb(201 185 232 / 0.55) 0 0.9px, transparent 1.2px),
        radial-gradient(circle at 31% 77%, rgb(235 197 207 / 0.48) 0 0.9px, transparent 1.2px);
      background-size: 23rem 23rem, 29rem 29rem, 31rem 31rem, 37rem 37rem;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      padding: clamp(2rem, 5vw, 4rem) 1.25rem;
      display: grid;
      place-items: center;
    }

    .profile {
      width: min(100%, 42rem);
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .avatar {
      position: relative;
      width: clamp(8.5rem, 24vw, 10.5rem);
      aspect-ratio: 1;
      margin-bottom: 2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 37% 31%, rgb(255 255 255 / 0.95), transparent 27%),
        radial-gradient(circle at 66% 70%, rgb(201 185 232 / 0.48), transparent 34%),
        radial-gradient(circle at 35% 69%, rgb(156 200 235 / 0.42), transparent 40%),
        radial-gradient(circle at 70% 35%, rgb(235 197 207 / 0.34), transparent 35%),
        rgb(252 252 254 / 0.74);
      border: 1px solid rgb(57 68 90 / 0.08);
      box-shadow:
        0 0 0 1rem rgb(255 255 255 / 0.35),
        0 1.2rem 4rem rgb(129 147 174 / 0.13),
        0 0 5rem rgb(201 185 232 / 0.15);
      backdrop-filter: blur(18px);
    }

    .avatar::before,
    .avatar::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .avatar::before {
      inset: 1.1rem;
      border: 1px solid rgb(156 200 235 / 0.7);
      box-shadow: inset 0 0 1.8rem rgb(201 185 232 / 0.13);
    }

    .avatar::after {
      width: 0.62rem;
      aspect-ratio: 1;
      top: 1.05rem;
      right: 1.18rem;
      background: var(--lilac);
      box-shadow: 0 0 1.4rem rgb(201 185 232 / 0.68);
    }

    .glyph {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: rgb(57 68 90 / 0.78);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.4rem, 12vw, 6rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.07em;
      color: #344057;
    }

    .handle {
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.1em;
    }

    .statement {
      margin: 2.2rem 0 2.25rem;
      color: rgb(57 68 90 / 0.76);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      font-size: clamp(1.05rem, 3vw, 1.2rem);
      font-weight: 400;
      line-height: 1.9;
      letter-spacing: 0.09em;
    }

    .links {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.58rem;
    }

    .links a {
      min-height: 3.25rem;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 1px solid rgb(57 68 90 / 0.08);
      border-radius: 1.1rem;
      color: rgb(57 68 90 / 0.78);
      background: rgb(255 255 255 / 0.49);
      backdrop-filter: blur(14px);
      text-decoration: none;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    .links a:hover,
    .links a:focus-visible {
      background: rgb(255 255 255 / 0.78);
      border-color: rgb(156 200 235 / 0.58);
      transform: translateY(-1px);
      box-shadow: 0 0.7rem 2.2rem rgb(129 147 174 / 0.10);
    }

    .links a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    .service {
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .destination {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.64rem;
      letter-spacing: 0.03em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .signature {
      margin-top: 2rem;
      width: 3.2rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--lilac), var(--pink), transparent);
      opacity: 0.8;
    }

    ::selection {
      color: var(--ink);
      background: rgb(156 200 235 / 0.5);
    }

    @media (max-width: 620px) {
      main { padding-inline: 1.1rem; }
      .profile { width: min(100%, 24rem); }
      .links { grid-template-columns: 1fr; }
      .avatar { margin-bottom: 1.65rem; }
      .statement { margin-block: 2rem 1.95rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .links a { transition: none; }
    }
  </style>
</head>

    </section>
  </main>
</body>
