<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1020">
  <meta name="color-scheme" content="dark">
  <title>KAFKA</title>
  <meta name="description" content="KAFKA — まだ名前のない構造を、現実にする。">
  <meta name="author" content="KAFKA">
  <meta property="og:title" content="KAFKA">
  <meta property="og:description" content="まだ名前のない構造を、現実にする。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kafka2306.github.io/kafka/">
  <link rel="canonical" href="https://kafka2306.github.io/kafka/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B1020'/%3E%3Ccircle cx='23' cy='32' r='6' fill='%235EDCF5'/%3E%3Ccircle cx='41' cy='24' r='4' fill='%23B9A6FF'/%3E%3C/svg%3E">
  <style>
    :root {
      --canvas: #0B1020;
      --surface: #12192B;
      --border: #2A3650;
      --text: #E8EEF8;
      --interactive: #5EDCF5;
      --relation: #B9A6FF;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(60rem 60rem at 82% 18%, rgb(185 166 255 / 0.12), transparent 46%),
        radial-gradient(44rem 44rem at 74% 72%, rgb(94 220 245 / 0.08), transparent 48%),
        var(--canvas);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgb(232 238 248 / 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgb(232 238 248 / 0.018) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 78% 32%, black, transparent 60%);
    }

    main {
      width: min(100%, 112rem);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(1.5rem, 4vw, 4rem);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .mark {
      width: 0.55rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--interactive);
      box-shadow: 0 0 2rem rgb(94 220 245 / 0.75);
    }

    .hero {
      align-self: center;
      max-width: 82rem;
      padding-block: 8vh;
    }

    h1 {
      margin: 0;
      font-size: clamp(4.6rem, 15vw, 13rem);
      font-weight: 540;
      line-height: 0.8;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    h1::after {
      content: ".";
      color: var(--relation);
    }

    .line {
      width: clamp(4rem, 10vw, 9rem);
      height: 1px;
      margin: clamp(2.4rem, 6vw, 5rem) 0 clamp(1.8rem, 4vw, 3rem);
      background: linear-gradient(90deg, var(--interactive), var(--relation));
      opacity: 0.9;
    }

    .statement {
      margin: 0;
      max-width: 18em;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      font-size: clamp(1.25rem, 2.3vw, 2.15rem);
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.08em;
      text-wrap: balance;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem clamp(1.5rem, 4vw, 4rem);
      align-items: center;
    }

    nav a {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: rgb(232 238 248 / 0.58);
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      transition: color 160ms ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0.5rem;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--interactive), var(--relation));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 160ms ease;
    }

    nav a:hover,
    nav a:focus-visible { color: var(--text); }

    nav a:hover::after,
    nav a:focus-visible::after { transform: scaleX(1); }

    nav a:focus-visible {
      outline: 2px solid var(--interactive);
      outline-offset: 6px;
      border-radius: 2px;
    }

    ::selection {
      color: var(--canvas);
      background: var(--interactive);
    }

    @media (max-width: 560px) {
      main { padding: 1.4rem; }
      .hero { padding-block: 5vh; }
      h1 { font-size: clamp(4rem, 23vw, 7rem); letter-spacing: 0.025em; }
      .statement { font-size: 1.15rem; line-height: 1.9; }
      nav { gap: 0.1rem 1.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      nav a,
      nav a::after { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>

    <section class="hero" aria-labelledby="name">
      <h1 id="name">KAFKA</h1>
      <div class="line" aria-hidden="true"></div>
      <p class="statement">まだ名前のない構造を、現実にする。</p>
    </section>

    <nav aria-label="Links">
      <a href="https://github.com/KAFKA2306" target="_blank" rel="me noopener noreferrer">CODE</a>
      <a href="https://note.com/kafkavr" target="_blank" rel="me noopener noreferrer">WORDS</a>
      <a href="https://x.com/kafka_vr" target="_blank" rel="me noopener noreferrer">SIGNAL</a>
    </nav>
  </main>
</body>
</html>
